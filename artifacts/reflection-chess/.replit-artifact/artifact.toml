kind = "mobile"
previewPath = "/"
title = "Reflection Chess"
version = "1.0.0"
id = "artifacts/reflection-chess"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20685

[services.development]
run = "pnpm --filter @workspace/reflection-chess run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reflection-chess", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/reflection-chess", "run", "serve" ]

[services.env]
PORT = "20685"
BASE_PATH = "/"
